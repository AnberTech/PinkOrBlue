<style>:root{
  --pink:#FF8FB8;--pink-deep:#D6336C;--pink-soft:#FFE3EE;
  --blue:#7EC8FF;--blue-deep:#1C6FB8;--blue-soft:#E2F2FF;
  --gold:#F2B93B;--gold-deep:#A8740A;--gold-soft:#FFF1CC;
  --cream:#FFF8EE;--surface:#FFFFFF;--ink:#2B2140;--ink-muted:#6E6380;--line:#EADFD0;
  --online:#2BB673;--danger:#E5484D;
  --r-sm:10px;--r-md:16px;--r-lg:24px;--r-xl:32px;
  --sh-1:0 1px 2px rgba(43,33,64,.06),0 4px 12px rgba(43,33,64,.08);
  --sh-2:0 2px 4px rgba(43,33,64,.08),0 12px 28px rgba(43,33,64,.14);
  --press:inset 0 -4px 0 rgba(0,0,0,.12);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-back:cubic-bezier(.34,1.56,.64,1);
  --f-head:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --pink-deep:#FF9FC3;--pink-soft:#4A2233;--blue-deep:#9AD4FF;--blue-soft:#1C3348;--gold:#F5C451;--gold-deep:#FFD877;--gold-soft:#3A2F18;
  --cream:#17121F;--surface:#231C2E;--ink:#F6EFFA;--ink-muted:#B9AEC8;--line:#3A3048;--online:#4FD597;--danger:#FF6B6E;
  --sh-1:0 0 0 1px var(--line);--sh-2:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.noscroll{overflow:hidden;touch-action:none}
h1,h2,h3{font-family:var(--f-head);line-height:1.1;margin:0 0 .4em;letter-spacing:-.01em}
a{color:var(--blue-deep)}
img{max-width:100%;height:auto}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-muted)}.small{font-size:.875rem}.center{text-align:center}
.eyebrow{font:800 .8rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 10px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;z-index:99;background:var(--surface);padding:8px 12px;border-radius:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---- üst çubuk */
.top{position:sticky;top:0;z-index:20;background:var(--cream);background:color-mix(in srgb,var(--cream) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:800 1.35rem/1 var(--f-head)}
.logo img{width:34px;height:34px;border-radius:10px}
.logo b{color:var(--pink-deep)}.logo i{font-style:normal;color:var(--blue-deep)}
.logo .lw{display:flex;flex-direction:column;line-height:1}
.logo .by{display:flex;align-items:center;gap:3px;margin-top:3px;font:700 .68rem/1 var(--f-body);color:var(--ink-muted);letter-spacing:.02em}
.logo .by em{font-style:normal;color:#B8962E}
.logo .by img{width:14px;height:auto;border-radius:0}
.am-l{display:none}
@media (prefers-color-scheme:light){.am-d{display:none}.am-l{display:inline}}
.maker{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:var(--sh-1);border-radius:var(--r-lg);padding:12px 16px;flex-basis:100%}
.maker img{width:44px;height:auto}
.maker small{color:var(--ink-muted);font-weight:700}
.r-maker{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font:700 .8rem/1 var(--f-body);color:#6E6380;border-top:1px solid #F1E8DA}
.r-maker img{width:16px;height:auto}
.top .sp{flex:1}
.lang{display:flex;gap:4px;font:800 .8rem/1 var(--f-body)}
.lang a{padding:8px 10px;border-radius:999px;text-decoration:none;color:var(--ink-muted)}
.lang a[aria-current]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--sh-1);font-size:18px;cursor:pointer;position:relative}
.icon-btn.needs::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.4s infinite}

/* ---- düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-md);border:0;background:var(--surface);color:var(--ink);font:800 1rem/1 var(--f-body);text-decoration:none;cursor:pointer;box-shadow:var(--sh-1),var(--press);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:var(--sh-1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-gold{background:linear-gradient(180deg,#FFD36B,var(--gold));color:#3B2A00}
.btn-big{min-height:60px;font-size:1.15rem;width:100%}
.btn-wa{background:#25D366;color:#073B1D}
.btn-danger{background:transparent;color:var(--danger);box-shadow:0 0 0 2px var(--danger)}

/* ---- tanıtım sayfası */
.hero{position:relative;padding:40px 0 30px;overflow:hidden}
.hero .wrap{display:grid;gap:24px;align-items:center}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.1fr .9fr}.hero{padding:70px 0 50px}}
.hero h1{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--pink-deep),var(--blue-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:1.1rem;color:var(--ink-muted);max-width:36em}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.hero .cta .btn{min-height:58px;font-size:1.1rem;padding:0 26px}
.hero-art{position:relative;height:340px}
.hero-art img{position:absolute;filter:drop-shadow(0 18px 24px rgba(43,33,64,.18))}
.hero-art .st{width:62%;left:6%;top:4%;animation:fly 6s ease-in-out infinite}
.hero-art .bp{width:30%;right:4%;top:0;animation:float 5s ease-in-out infinite}
.hero-art .bb{width:26%;right:22%;top:30%;animation:float 6s ease-in-out -2s infinite}
.hero-art .gf{width:36%;left:30%;bottom:-4%;animation:float 7s ease-in-out -1s infinite}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(10px,-16px) rotate(2deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.sec{padding:50px 0}
.h2{font-size:clamp(1.8rem,5vw,2.6rem)}
.steps{display:grid;gap:16px;counter-reset:s;margin-top:20px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--surface);border-radius:var(--r-lg);padding:24px;box-shadow:var(--sh-1);position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--gold-soft);color:var(--gold-deep);font:800 1.3rem/1 var(--f-head);margin-bottom:12px}
.step:nth-child(1)::before{background:var(--pink-soft);color:var(--pink-deep)}.step:nth-child(3)::before{background:var(--blue-soft);color:var(--blue-deep)}
.step h3,.feat h3{font-size:1.25rem}.step p,.feat p{margin:0;color:var(--ink-muted)}
.feats{display:grid;gap:14px;margin-top:20px}
@media(min-width:640px){.feats{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.feats{grid-template-columns:repeat(3,1fr)}}
.feat{background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-1)}
.feat .fi{font-size:28px;display:block;margin-bottom:8px}
.band{background:linear-gradient(120deg,var(--pink-soft),var(--blue-soft));border-radius:var(--r-xl);padding:36px 24px;text-align:center}
.band h2{font-size:clamp(1.6rem,5vw,2.3rem)}
.faq .qa{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-1);margin:10px 0;padding:0 18px}
.faq summary{cursor:pointer;padding:16px 0;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";font:800 1.4rem/1 var(--f-head);color:var(--gold-deep)}
.faq details[open] summary::after{content:"–"}
.faq .qa p{margin:0 0 16px;color:var(--ink-muted)}
footer{padding:30px 0 40px;color:var(--ink-muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink-muted)}

/* ---- uygulama */
.app-page main{max-width:520px;margin:0 auto;padding:8px 16px 60px}
.app-intro{text-align:center;padding:10px 0 6px}
.app-intro h1{font-size:clamp(2rem,8vw,2.6rem)}
.app-intro h1 em{font-style:normal;color:var(--pink-deep)}
.app-intro img{width:150px;margin:-6px auto 0;display:block;filter:drop-shadow(0 10px 14px rgba(43,33,64,.15));animation:fly 6s ease-in-out infinite}
body[data-view=room] .app-intro,body[data-view=room] .seo{display:none}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:20px;margin:14px 0}
.card h2{font-size:1.35rem}.card h3{font-size:1.1rem;margin-top:14px}
.form label,.guesses label,.lbl{display:block;font-weight:800;margin:0 0 14px}
.form em{font-style:normal;font-weight:600;color:var(--ink-muted)}
.form small{display:block;font-weight:400;color:var(--ink-muted);margin-top:6px;font-size:.85rem}
input,textarea,select{width:100%;margin-top:6px;min-height:48px;padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--cream);color:var(--ink);font:600 1rem/1.3 var(--f-body)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row.gap{justify-content:flex-start;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--gold-soft);color:var(--ink);font:700 .95rem/1.2 var(--f-body)}
button.chip{cursor:pointer;min-height:40px}
.chip.on{background:var(--gold);color:#3B2A00}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink-muted)}
.chip.dashed{box-shadow:none;border:2px dashed var(--line)}
.join .room-title{font-size:2rem}
#jf{display:grid;gap:12px;margin-top:10px}
.ok{color:var(--online);font-weight:800}
.room-head{text-align:center;padding:14px 0 0}
.room-title{font-size:clamp(1.7rem,7vw,2.3rem)}
.cd{margin:0;color:var(--ink-muted);font-weight:700}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD36B,var(--gold));border-radius:6px;transition:width .6s var(--ease-out)}

/* gökyüzü + balonlar */
.sky{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;padding:18px 4px 8px;min-height:170px;border-radius:var(--r-xl);margin-top:12px;background:var(--blue-soft);
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--blue-soft) 70%,transparent),transparent 70%),radial-gradient(80% 60% at 80% 100%,color-mix(in srgb,var(--pink-soft) 70%,transparent),transparent 70%)}
.balloon{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:62px;animation:bob var(--dur,4s) ease-in-out var(--d,0s) infinite}
.balloon .bb{position:relative;display:grid;place-items:center;width:50px;height:58px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;border:2px dashed var(--line);background:transparent;opacity:.75;transition:all .5s var(--ease-back)}
.balloon.voted .bb{border:0;opacity:1;background:radial-gradient(circle at 32% 28%,#FFF1B8 0 12%,#FFD36B 30%,var(--gold) 65%,#C9900F 100%);box-shadow:0 6px 14px rgba(168,116,10,.25)}
.balloon .bb::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-5px;border:5px solid transparent;border-top:6px solid var(--line)}
.balloon.voted .bb::after{border-top-color:#C9900F}
.balloon .av{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:#2B2140;font:800 .85rem/1 var(--f-body);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.balloon .str{width:1px;height:16px;background:var(--ink-muted);opacity:.4;margin-top:4px}
.balloon .nm{font:700 .72rem/1.1 var(--f-body);color:var(--ink-muted);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balloon.on .bb::before{content:"";position:absolute;right:2px;bottom:6px;width:11px;height:11px;border-radius:50%;background:var(--online);box-shadow:0 0 0 2px var(--surface);animation:pulse 2s infinite}
.balloon.me .nm{color:var(--gold-deep);font-weight:800}
.balloon:not(.on){opacity:.65}
.balloon.hop{animation:hop .5s var(--ease-back)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,182,115,.5)}70%{box-shadow:0 0 0 8px rgba(43,182,115,0)}100%{box-shadow:0 0 0 0 rgba(43,182,115,0)}}

/* oy */
.vote-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.vb{border:0;cursor:pointer;min-height:96px;border-radius:var(--r-lg);font:800 1.3rem/1 var(--f-head);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sh-1),var(--press);transition:transform .2s var(--ease-back),box-shadow .2s}
.vb .vi{font-size:30px}
.vb.girl{background:var(--pink-soft);color:var(--pink-deep)}
.vb.boy{background:var(--blue-soft);color:var(--blue-deep)}
.vb.on{transform:scale(1.04)}.vb.girl.on{background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(214,51,108,.35),var(--press)}
.vb.boy.on{background:var(--blue);color:#0B3A63;box-shadow:0 8px 20px rgba(28,111,184,.35),var(--press)}
.vb:active{transform:translateY(2px)}
.guesses summary{cursor:pointer;font-weight:800;color:var(--gold-deep);padding:8px 0}
.keeper{background:linear-gradient(160deg,var(--gold-soft),var(--surface) 60%);box-shadow:var(--sh-2),inset 0 0 0 2px var(--gold)}
.host{box-shadow:var(--sh-1),inset 0 0 0 2px var(--line)}
.start{margin-top:6px;animation:glow 2s infinite}
.start:disabled{animation:none}
@keyframes glow{0%,100%{box-shadow:var(--sh-1),var(--press),0 0 0 0 rgba(242,185,59,.6)}50%{box-shadow:var(--sh-1),var(--press),0 0 0 10px rgba(242,185,59,0)}}
.danger-zone summary{cursor:pointer;font-weight:800;color:var(--ink-muted);padding:10px 0}
.danger-zone .btn{margin:0 8px 10px 0}
.board{margin:10px 0;padding:0;list-style:none;counter-reset:b}
.board li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;counter-increment:b}
.board li:nth-child(odd){background:var(--cream)}
.board li span::before{content:counter(b) ". ";color:var(--ink-muted);font-weight:800}
.link-row{display:flex;gap:8px}.link-row input{margin:0;font-size:.85rem}
.big-emoji{font-size:56px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;z-index:200;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;transition:all .35s var(--ease-back);text-align:center}
.toast.in{transform:translate(-50%,0);opacity:1}

/* şov + oyun katmanları */
.show,.game{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;touch-action:none;user-select:none;-webkit-user-select:none}
.show{background:#17121F;transition:opacity .6s}
.show.out{opacity:0}
.show canvas,.game canvas{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
.show-ui{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center}
.show-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.game{background:linear-gradient(180deg,#BFE6FF,#FFE3EE)}
.game-hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 10px;font:800 1.6rem/1 var(--f-head);color:#2B2140;pointer-events:none}
.game-hud .g-score::before{content:"🎈 "}.game-hud .g-time{margin-left:auto}.game-hud .g-time::before{content:"⏱ "}
.g-close{pointer-events:auto;border:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8);font-size:18px;cursor:pointer;color:#2B2140}
.game-start{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;padding:16px;background:rgba(43,33,64,.25)}
.game-start .card{max-width:360px;text-align:center;background:#fff;color:#2B2140}

/* sonuç kartı (paylaşılan görüntü hep açık temada) */
.result{--rc:var(--pink);--rd:#D6336C;--rs:#FFE3EE;background:#fff;color:#2B2140;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2);margin-top:14px;animation:rise .7s var(--ease-back)}
.result.is-boy{--rc:var(--blue);--rd:#1C6FB8;--rs:#E2F2FF}
.result>section{padding:14px 20px;border-top:1px solid #F1E8DA}
.result h2{font-size:1.1rem}
.r-top{text-align:center;padding:24px 20px 20px;background:linear-gradient(160deg,var(--rs),var(--rc));color:#fff}
.r-top h1{font-size:clamp(3.5rem,18vw,5rem);margin:0;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.08)}
.r-top p{margin:.2em 0;font-weight:800;color:#2B2140}
.r-brand{font:800 .9rem/1 var(--f-head);opacity:.85}.r-brand span{opacity:.6}
.r-me{margin:0;padding:12px 20px;text-align:center;font-weight:800;background:#FFF8EE}.r-me.yes{background:var(--rs);color:var(--rd)}
.r-pie{display:flex;align-items:center;gap:18px}
.r-pct{font:800 1.8rem/1 var(--f-head);color:var(--rd);margin:0 0 6px}
.pie-g{animation:pie 1s var(--ease-out)}
@keyframes pie{from{stroke-dasharray:0 999}}
.chip.res{background:var(--rs);color:var(--rd)}

/* ---- v2: form, takvim, kurucu akışı, sade alt bilgi */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;background:var(--cream);padding:4px;border-radius:var(--r-md);border:2px solid var(--line)}
.seg label{margin:0;cursor:pointer}

.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:12px;font-weight:800;color:var(--ink-muted);transition:all .2s}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg input:focus-visible+span{outline:3px solid var(--gold)}
.lbl>input[name=other]{margin-top:8px}
.dt{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dt .dp-wrap{flex:1 1 180px}
.tm{display:flex;align-items:center;gap:4px}
.tm select{width:auto;min-width:72px;margin:0;text-align:center;-webkit-appearance:none;appearance:none;padding:12px 10px}
.dp-wrap{position:relative;display:block}
.dp-btn{width:100%;min-height:48px;margin-top:6px;padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--cream);color:var(--ink);font:700 1rem/1.2 var(--f-body);text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
.dt .dp-btn{margin-top:0}
.dp-btn::before{content:"📅"}
.dp-btn.empty{color:var(--ink-muted);font-weight:600}
.cal{position:absolute;z-index:50;top:calc(100% + 6px);left:0;width:300px;max-width:calc(100vw - 48px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:12px;animation:rise .25s var(--ease-out)}

.flow-steps{list-style:none;margin:8px 0 0;padding:0;counter-reset:f}
.flow-steps>li{position:relative;padding:14px 0 14px 0;border-top:1px dashed var(--line)}
.flow-steps>li:first-child{border-top:0;padding-top:4px}
.flow-steps>li>b{display:block;font:800 1.05rem/1.2 var(--f-head);margin-bottom:6px}
.flow-steps>li.done>b::after{content:" ✓";color:var(--online)}
.flow-steps>li.locked{opacity:.75}
.flow-steps .vote-btns{margin:8px 0 4px}

.link-text{word-break:break-all;margin:8px 0 0}
.settings{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.settings summary{cursor:pointer;font-weight:800;color:var(--ink-muted);padding:8px 0}
.settings .btn{margin:0 8px 10px 0}
.settings small{display:block;font-weight:600;margin-top:2px}
.vote.has h2{font-size:1.2rem}

.vote.has .vb .vi{font-size:22px}
.game-card .row{align-items:center;flex-wrap:nowrap}
.game-card h2{margin:0 0 2px;font-size:1.15rem}
.game-card p{margin:0}
.board li.me{outline:2px solid var(--gold);outline-offset:-2px}
.share-mini .row{flex-wrap:wrap}
.share-mini p{margin:2px 0 0}
details.waiting summary{cursor:pointer;font-weight:800}
.secret-note{margin-top:6px}
footer.mini{padding:18px 0 28px}

.mini-maker{display:flex;align-items:center;gap:6px;color:var(--ink-muted);text-decoration:none;font-weight:700}
.mini-maker img{width:18px;height:auto}
